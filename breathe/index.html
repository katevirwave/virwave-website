<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VirWave Breathe</title>
<style>
.vw, .vw * { box-sizing: border-box; }
body { margin: 0; background: #122B52; }
.vw {
  --vw-h: 100vh;
  --vw-safe-t: env(safe-area-inset-top, 0px);
  --vw-safe-b: env(safe-area-inset-bottom, 0px);
  --vw-bar-b: calc(max(var(--vw-safe-b), 32px) + 8px);
  --vw-pill-b: calc(var(--vw-bar-b) + 32px);
  --vw-dock: calc(var(--vw-pill-b) + 64px);
  --vw-e: min(100vw, calc((var(--vw-h) / 2 - var(--vw-dock)) / 0.5103), 480px);
  --vw-shape: calc(var(--vw-e) * 0.55);
  position: relative; overflow: hidden;
  min-height: var(--vw-h);
  color: #FFFFFF;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
@supports (height: 100dvh) {
  .vw { --vw-h: 100dvh; }
}
/*
 * A wide window is far taller in points than a phone, so the app's 40 px under the
 * progress line reads as cramped there. Past phone widths the line keeps the same
 * share of the height it has on the reference phone's safe area, or more.
 */
@media (min-width: 700px) {
  .vw { --vw-bar-b: max(calc(var(--vw-safe-b) + 8px), 40px, calc(var(--vw-h) * 0.075)); }
}
/*
 * In the chat (MCP Apps inline view) the session is a card, not a whole screen. The
 * orb stays the hero: it is centred in the space above the controls and fills it,
 * rather than being centred on a tall screen with empty sky above.
 */
.vw[data-display="inline"] {
  --vw-top: 16px;
  --vw-bar-b: 28px;
  --vw-pill-b: calc(var(--vw-bar-b) + 48px);
  --vw-e: min(calc(100vw - 32px), calc((var(--vw-h) - var(--vw-dock) - var(--vw-top)) / 1.0206), 480px);
  border-radius: 16px;
}
.vw[data-display="inline"] .vw-stage, .vw[data-display="inline"] .vw-countdown, .vw[data-display="inline"] .vw-phase { top: var(--vw-top); bottom: var(--vw-dock); }
/* A session with a hold note keeps the top of the card for it, so the note never sits on the orb. */
.vw[data-display="inline"][data-note] { --vw-top: 96px; }
/* The line under the pill hangs below it, so the pill never rides up over the orb. */
.vw[data-display="inline"] .vw-under { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px; }
.vw[data-display="inline"] .vw-complete { padding-top: 32px; padding-bottom: 32px; }
.vw-layer { position: absolute; inset: 0; }
/* Session background: sessionTokens.background, top-left to bottom-right, under the default dim. */
.vw-bg { background: linear-gradient(var(--vw-bg-angle, 155.2deg), #122B52, #1A4A72, #0A7EA4); }
.vw-dim { background: rgba(0, 0, 0, 0.6); opacity: 0.3; }
.vw-session { transition: opacity 350ms cubic-bezier(0.32, 0, 0.67, 0), visibility 0s linear 350ms; }
.vw[data-state="finished"] .vw-session { opacity: 0; visibility: hidden; }

/* CinematicParticles: the field fills the screen, so the dots spread across it as the app's do. */
.vw-particle { position: absolute; border-radius: 9999px; background: #FFFFFF; will-change: transform, opacity; }

/* Stage: SessionAura (outer, mid, inner) + ShapeAura glow + the shape, centred on the screen. */
.vw-stage { display: grid; place-items: center; pointer-events: none; }
.vw-stage > * { grid-area: 1 / 1; }
.vw-ring, .vw-glow { border-radius: 50%; overflow: hidden; will-change: transform, opacity; }
.vw-ring-outer {
  width: calc(var(--vw-e) * 0.9538); height: calc(var(--vw-e) * 0.9538);
  background: linear-gradient(135deg, rgba(74, 144, 226, 0.3451) 50%, rgba(74, 144, 226, 0.1176) 75%, rgba(74, 144, 226, 0) 100%);
  opacity: 0.62; transform: scale(0.94);
}
.vw-ring-mid { width: calc(var(--vw-e) * 0.8872); height: calc(var(--vw-e) * 0.8872); }
.vw-sweep {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(90deg, rgba(74, 144, 226, 0) 0%, rgba(74, 144, 226, 0.2353) 25%, rgba(74, 144, 226, 0.3216) 50%, rgba(74, 144, 226, 0.2353) 75%, rgba(74, 144, 226, 0) 100%);
  animation: vw-spin 20s linear infinite;
}
@keyframes vw-spin { to { transform: rotate(360deg); } }
.vw-ring-inner {
  width: calc(var(--vw-e) * 0.8205); height: calc(var(--vw-e) * 0.8205);
  background: linear-gradient(180deg, rgba(74, 144, 226, 0.2824) 0%, rgba(74, 144, 226, 0.1176) 50%, rgba(74, 144, 226, 0) 100%);
  opacity: 0.4; transform: scale(0.96);
}
.vw-glow {
  width: calc(var(--vw-e) * 0.748); height: calc(var(--vw-e) * 0.748);
  background: radial-gradient(closest-side, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.72) 46%, rgba(255, 255, 255, 0.56) 78%, rgba(255, 255, 255, 0) 100%);
  opacity: 0.15; transform: scale(0.975);
}
.vw-orb { display: grid; place-items: center; }
.vw-orb > * { grid-area: 1 / 1; }
/* Positioned so it paints above the aura layers, which composite on their own. */
.vw-shape { position: relative; z-index: 1; width: var(--vw-shape); height: var(--vw-shape); overflow: visible; }
/* Matched sessions carry one drawing per stage shape; only the live stage's shows (app/session.tsx swaps the renderer). */
.vw-shape:not([data-active]) { display: none; }
.vw-shape path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.vw-base { stroke: #4A90E2; }
.vw-draw, .vw-tail { stroke: #4A90E2; stroke-dasharray: 1 1; }
/* At rest the full outline shows; the player clears it when a session starts. */
.vw-draw { stroke-dashoffset: 0; }
.vw-tail { stroke-dashoffset: 0; opacity: 0; }

/* CountdownOverlay: 3, 2, 1 */
.vw-countdown { display: grid; place-items: center; pointer-events: none; }
.vw-countdown span {
  font-size: 56px; font-weight: 100; line-height: 1; color: #FFFFFF;
  font-variant-numeric: tabular-nums; opacity: 0;
}
.vw-countdown span.vw-tick { animation: vw-tick 870ms both; }
@keyframes vw-tick {
  0% { opacity: 0; transform: scale(0.88); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  23% { opacity: 0.88; }
  40% { transform: scale(1); }
  77% { opacity: 0.88; animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
  100% { opacity: 0; transform: scale(1); }
}

/* PhaseTextOverlay: centred on the shape, frosted pill behind it */
.vw-phase {
  display: grid; place-items: center; pointer-events: none;
  opacity: 0; transition: opacity 350ms cubic-bezier(0.32, 0, 0.67, 0);
}
.vw[data-state="running"] .vw-phase { opacity: 1; transition-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
.vw[data-state="paused"] .vw-phase { opacity: 0.55; }
.vw-phase-card {
  transition: opacity 350ms cubic-bezier(0.33, 1, 0.68, 1);
  display: flex; flex-direction: column; align-items: center;
  transform: translateY(calc(var(--vw-shape) * var(--vw-text-offset, 0)));
  padding: 8px 16px; border-radius: 9999px;
  background: rgba(255, 255, 255, 0.06);
}
.vw-phase-card.vw-invert { flex-direction: column-reverse; }
.vw-label {
  font-size: 17px; letter-spacing: 2.5px; text-transform: uppercase; text-align: center;
  color: #FFFFFF; opacity: 0.72;
  margin-bottom: 8px; transform: translateY(-4px);
  transition: opacity 75ms cubic-bezier(0.33, 1, 0.68, 1);
}
.vw-invert .vw-label { margin-bottom: 0; margin-top: 8px; transform: translateY(4px); }
.vw-label.vw-swap { opacity: 0; transition-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
.vw-count {
  font-size: 56px; line-height: 56px; font-weight: 100;
  color: #FFFFFF; opacity: 0.88; font-variant-numeric: tabular-nums;
}
.vw[data-text="off"] .vw-label, .vw[data-count="off"] .vw-count { display: none; }
.vw[data-text="off"][data-count="off"] .vw-phase-card { opacity: 0; transition: opacity 200ms cubic-bezier(0.32, 0, 0.67, 0); }

/* Bottom controls: SessionControlPill, then the remaining time while paused */
.vw-dock {
  position: absolute; left: 0; right: 0; bottom: var(--vw-pill-b);
  display: flex; flex-direction: column; align-items: center;
  padding: 0 16px;
}
.vw-pill {
  display: flex; align-items: center; border-radius: 9999px; overflow: hidden;
  background: rgba(255, 255, 255, 0.12); color: #FFFFFF;
  transition: opacity 120ms cubic-bezier(0.33, 1, 0.68, 1), visibility 0s;
}
.vw-pill[data-idle] { opacity: 0.35; transition: opacity 1200ms cubic-bezier(0.32, 0, 0.67, 0); }
.vw-pill:has(:focus-visible) { opacity: 1; }
.vw-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 64px; height: 48px; padding: 0; margin: 0;
  border: 0; border-radius: 9999px; background: transparent; color: inherit;
  font: inherit; cursor: pointer;
}
.vw-btn:focus-visible { outline: 2px solid #8CEBAA; outline-offset: -4px; }
.vw-icon { display: block; transition: opacity 200ms cubic-bezier(0.42, 0, 0.58, 1), transform 200ms cubic-bezier(0.42, 0, 0.58, 1); }
.vw-btn[aria-checked="false"] .vw-icon { opacity: 0.35; }
.vw-stack { position: relative; width: 20px; height: 20px; }
.vw-stack .vw-icon { position: absolute; inset: 0; }
.vw-stack .vw-icon-play, .vw[data-state="paused"] .vw-stack .vw-icon-pause { opacity: 0; transform: scale(0.96); }
.vw[data-state="paused"] .vw-stack .vw-icon-play { opacity: 1; transform: scale(1); }
.vw-divider { width: 0.5px; height: 24px; background: currentColor; opacity: 0.3; flex: none; }
.vw-begin { width: auto; padding: 0 24px 0 20px; font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
.vw-pill-begin, .vw-pill-session { display: none; }
.vw[data-state="ready"] .vw-pill-begin { display: flex; }
.vw[data-state="running"] .vw-pill-session, .vw[data-state="paused"] .vw-pill-session { display: flex; }
.vw-under {
  margin: 12px 0 0; font-size: 20px; font-weight: 300; opacity: 0.94;
  color: #FFFFFF; text-align: center; font-variant-numeric: tabular-nums;
}
.vw-under:empty { display: none; }
/* Before a pattern with a long hold: a quiet safety line at the top, clear of the orb and the pill. */
.vw-note {
  position: absolute; top: calc(max(var(--vw-safe-t), 16px) + 16px); left: 0; right: 0;
  margin: 0 auto; padding: 0 24px; max-width: calc(36ch + 48px); font-size: 13px; line-height: 1.5;
  color: rgba(255, 255, 255, 0.80); text-align: center; text-wrap: balance;
}
.vw:not([data-state="ready"]) .vw-note { display: none; }

/* SessionProgressBar: one segment per cycle (grouped past 8) */
.vw-progress {
  position: absolute; left: 50%; bottom: var(--vw-bar-b); transform: translateX(-50%);
  width: calc(var(--vw-e) * 0.52); height: 3px;
  display: flex; gap: 3px;
  opacity: 0; transition: opacity 350ms cubic-bezier(0.32, 0, 0.67, 0);
}
.vw[data-state="running"] .vw-progress, .vw[data-state="paused"] .vw-progress { opacity: 1; transition-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
.vw-seg { position: relative; flex: 1; height: 100%; overflow: hidden; background: rgba(255, 255, 255, 0.06); }
.vw-seg:first-child { border-radius: 9999px 0 0 9999px; }
.vw-seg:last-child { border-radius: 0 9999px 9999px 0; }
.vw-seg:only-child { border-radius: 9999px; }
.vw-seg i { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.18); transform-origin: left; transform: scaleX(0); border-radius: inherit; }

/* SessionCompleteOverlay (title, subtitle, and the primary action) */
.vw-complete {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  width: 100%; max-width: 400px; margin: 0 auto; padding: 48px 24px;
  text-align: center; opacity: 0; visibility: hidden;
  transition: opacity 350ms cubic-bezier(0.33, 1, 0.68, 1), visibility 0s linear 350ms;
}
.vw[data-state="finished"] .vw-complete { opacity: 1; visibility: visible; transition-delay: 350ms, 0s; }
.vw-complete h2 {
  margin: 0 0 8px; font-size: 34px; font-weight: 300; letter-spacing: 0.5px;
  color: #FFFFFF;
}
.vw-complete p {
  margin: 0 0 32px; font-size: 13px; letter-spacing: 0.3px; opacity: 0.75;
  color: rgba(255, 255, 255, 0.80);
}
.vw-cta {
  width: 100%; padding: 12px 24px; border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.30); background: rgba(255, 255, 255, 0.20); color: #FFFFFF;
  font: inherit; font-size: 20px; font-weight: 600; cursor: pointer;
}
.vw-cta:focus-visible { outline: 2px solid #8CEBAA; outline-offset: 3px; }
/* Get the app: a quiet text link, styled like the app's "Just breathe" (app/begin.tsx). */
.vw-store {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
  margin-top: 24px; padding: 0 16px; border-radius: 9999px;
  font-size: 13px; font-weight: 300; letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.80); text-decoration: none;
}
.vw-store:hover { text-decoration: underline; text-underline-offset: 3px; }
.vw-store:focus-visible { outline: 2px solid #8CEBAA; outline-offset: 2px; }

.vw-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Reduced motion: the app's still aura, no drift, no rotation, instant fades. */
@media (prefers-reduced-motion: reduce) {
  .vw-sweep { animation-play-state: paused; }
  .vw-countdown span.vw-tick { animation: none; opacity: 1; }
  .vw-session, .vw-phase, .vw-phase-card, .vw-label, .vw-pill, .vw-pill[data-idle], .vw-icon, .vw-progress, .vw-complete { transition: none !important; }
  .vw-pill[data-idle] { opacity: 1; }
}

html, body { margin: 0; background: #122B52; }
.vw[data-display="fullscreen"] { border-radius: 0; }
.vw-note:empty { display: none; }
/* Clear of the expand control in the corner. */
.vw[data-display="inline"] .vw-note { padding-left: 64px; padding-right: 64px; max-width: calc(36ch + 128px); }
/* When there is no session to show (the tool call failed or was cancelled), one quiet line says so. */
.vw[data-state] .vw-note.vw-note-status { display: block; top: auto; bottom: calc(var(--vw-pill-b) + 16px); }
/* Expand: a glass disc in the pill's language, in the top corner, with the app's 48 px hit target. */
.vw-expand {
  position: absolute; top: calc(var(--vw-safe-t) + 8px); right: 8px; z-index: 2;
  display: grid; place-items: center; width: 48px; height: 48px; padding: 0; margin: 0;
  border: 0; border-radius: 9999px; background: transparent; color: #FFFFFF; cursor: pointer;
  transition: opacity 120ms cubic-bezier(0.33, 1, 0.68, 1);
}
.vw-expand[hidden] { display: none; }
.vw-expand > span { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: rgba(255, 255, 255, 0.12); }
.vw-expand .vw-icon { position: absolute; }
.vw-expand .vw-icon-collapse, .vw[data-display="fullscreen"] .vw-expand .vw-icon-expand { opacity: 0; }
.vw[data-display="fullscreen"] .vw-expand .vw-icon-collapse { opacity: 1; }
.vw-expand[data-idle] { opacity: 0.35; transition: opacity 1200ms cubic-bezier(0.32, 0, 0.67, 0); }
.vw-expand:focus-visible { opacity: 1; outline: 2px solid #8CEBAA; outline-offset: -4px; }
@media (prefers-reduced-motion: reduce) {
  .vw-expand, .vw-expand[data-idle] { transition: none !important; opacity: 1; }
}
</style>
</head>
<body>
<main class="vw" data-vw-root data-embed="app" data-version="1.2.0" data-display="inline" data-state="waiting" data-text="on" data-count="on">
  <h1 class="vw-sr">VirWave Breathe</h1>
  <div class="vw-layer vw-bg" aria-hidden="true"></div>
  <div class="vw-layer vw-dim" aria-hidden="true"></div>
  <div class="vw-layer vw-session" data-vw="session">
    <div class="vw-layer vw-particles" aria-hidden="true"><i class="vw-particle" data-vw="particle" style="left: 10%; top: 14%; width: 2px; height: 2px; opacity: 0.32"></i><i class="vw-particle" data-vw="particle" style="left: 22%; top: 30%; width: 4px; height: 4px; opacity: 0.4"></i><i class="vw-particle" data-vw="particle" style="left: 38%; top: 12%; width: 2px; height: 2px; opacity: 0.3"></i><i class="vw-particle" data-vw="particle" style="left: 51%; top: 26%; width: 4px; height: 4px; opacity: 0.38"></i><i class="vw-particle" data-vw="particle" style="left: 65%; top: 8%; width: 2px; height: 2px; opacity: 0.28"></i><i class="vw-particle" data-vw="particle" style="left: 74%; top: 22%; width: 4px; height: 4px; opacity: 0.42"></i><i class="vw-particle" data-vw="particle" style="left: 86%; top: 15%; width: 4px; height: 4px; opacity: 0.36"></i><i class="vw-particle" data-vw="particle" style="left: 12%; top: 44%; width: 2px; height: 2px; opacity: 0.3"></i><i class="vw-particle" data-vw="particle" style="left: 29%; top: 52%; width: 4px; height: 4px; opacity: 0.38"></i><i class="vw-particle" data-vw="particle" style="left: 47%; top: 42%; width: 2px; height: 2px; opacity: 0.28"></i><i class="vw-particle" data-vw="particle" style="left: 60%; top: 56%; width: 4px; height: 4px; opacity: 0.34"></i><i class="vw-particle" data-vw="particle" style="left: 82%; top: 48%; width: 2px; height: 2px; opacity: 0.3"></i></div>
    <section class="vw-layer vw-stage" role="img" aria-label="Breathing session." data-vw="stage">
      <div class="vw-orb" aria-hidden="true">
        <div class="vw-ring vw-ring-outer" data-vw="aura-outer"></div>
        <div class="vw-ring vw-ring-mid" data-vw="aura-mid"><div class="vw-sweep"></div></div>
        <div class="vw-ring vw-ring-inner" data-vw="aura-inner"></div>
        <div class="vw-glow" data-vw="aura-glow"></div>
      </div>
      <svg class="vw-shape" data-shape="box" viewBox="0 0 100 100" aria-hidden="true" focusable="false" data-label="Box shape. The outline draws itself once per breath cycle." data-text-offset="0">
      <path class="vw-base" d="M 14 14 L 86 14 L 86 86 L 14 86 L 14 14" stroke-width="1.95" opacity="0.38"/>
      <path class="vw-tail" data-vw="tail" d="M 14 14 L 86 14 L 86 86 L 14 86 L 14 14" pathLength="1" stroke-width="2.78"/>
      <path class="vw-draw" data-vw="draw" d="M 14 14 L 86 14 L 86 86 L 14 86 L 14 14" pathLength="1" stroke-width="2.78"/>
      </svg>
      <svg class="vw-shape" data-shape="triangle" viewBox="0 0 100 100" aria-hidden="true" focusable="false" data-label="Triangle shape. The outline draws itself once per breath cycle." data-text-offset="0.07">
      <path class="vw-base" d="M 50 3.812 L 90 73.094 L 10 73.094 L 50 3.812" stroke-width="1.39" opacity="0.18"/>
      <path class="vw-tail" data-vw="tail" d="M 50 3.812 L 90 73.094 L 10 73.094 L 50 3.812" pathLength="1" stroke-width="2.78"/>
      <path class="vw-draw" data-vw="draw" d="M 50 3.812 L 90 73.094 L 10 73.094 L 50 3.812" pathLength="1" stroke-width="2.78"/>
      </svg>
      <svg class="vw-shape" data-shape="circle" viewBox="0 0 100 100" aria-hidden="true" focusable="false" data-label="Circle shape. The ring draws itself once per breath cycle." data-text-offset="0">
      <path class="vw-base" d="M 97.22 50 A 47.22 47.22 0 1 1 2.78 50 A 47.22 47.22 0 1 1 97.22 50" stroke-width="1.39" opacity="0.18"/>
      <path class="vw-tail" data-vw="tail" d="M 97.22 50 A 47.22 47.22 0 1 1 2.78 50 A 47.22 47.22 0 1 1 97.22 50" pathLength="1" stroke-width="2.78"/>
      <path class="vw-draw" data-vw="draw" d="M 97.22 50 A 47.22 47.22 0 1 1 2.78 50 A 47.22 47.22 0 1 1 97.22 50" pathLength="1" stroke-width="2.78"/>
      </svg>
      <svg class="vw-shape" data-shape="focus-point" viewBox="0 0 100 100" aria-hidden="true" focusable="false" data-label="Focus point shape. A soft point crosses a line as you breathe in and comes back as you breathe out." data-text-offset="0.34">
      <defs><radialGradient id="vw-glow-focus-point" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4A90E2" stop-opacity="1"/><stop offset="100%" stop-color="#4A90E2" stop-opacity="0"/></radialGradient></defs>
      <line x1="16" y1="50" x2="84" y2="50" stroke="#4A90E2" stroke-width="1.39" stroke-opacity="0.16" stroke-linecap="round"/>
      <circle data-vw="point" cx="22.63" cy="50" opacity="1" r="17.347" fill="url(#vw-glow-focus-point)"/>
      <circle data-vw="point" cx="22.63" cy="50" opacity="1" r="6.672" fill="#4A90E2"/>
      </svg>
